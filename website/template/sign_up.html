{% extends 'layout.html' %}

{% block custom_styles %}
<style>
@media screen and (max-width: 500px){
    .option_box_column{
        clear:both;
        width: 100%;
    }
    .main_view_column{
        clear:both;
        width: 100%;
    }
    .option_box{
        padding: 7%;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 0%;
    }
}
</style>
{% endblock %}

{% block options %}
    <a class="a_option" href="/login">
        <p class="option_box"><-BACK</p>
    </a>
{% endblock %}

{% block mainview %}
<div id="main_view">
    <p>HELLO BUDDY</p>
    <p>Please, fill in the following details to make an account</p>
    {% if error != None %}
        <p>ERROR - {{ error }}</p>
    {% endif %}
    <form method="POST">
        <input class="small_input" placeholder="username" name = "username">
        <input class="small_input" type="password" placeholder="super secret password" name = "password">
        <input class="checkbox" type="checkbox" id="starters" name="starters" value="starters">
        <label for="starters"> Load starter workouts? </label><br>
        <button type="submit" class="small_buttons">Create Account!</button>
    </form>
</div>

{% endblock %}
